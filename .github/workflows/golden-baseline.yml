name: golden-baseline

# Runs the golden / remote widget tests against upstream main in this exact
# runner image, so a red result on a feature branch can be told apart from a
# baseline that is already red before the change.
on:
  push:
    branches: [baseline/upstream-goldens]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: test deps (fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji fish zsh
          test -f "$DSH_TEST_FONT_DIR/NotoSansCJK-Light.ttc"
          sudo install -Dm644 /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - name: pub get
        working-directory: app
        run: |
          sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock
          flutter pub get
      - name: goldens + remote widgets (baseline)
        working-directory: app
        run: |
          set -o pipefail
          flutter test --no-pub --reporter compact \
            test/drawer/drawer_golden_test.dart \
            test/remote/remote_golden_test.dart \
            test/remote/remote_widgets_test.dart 2>&1 | tee /tmp/golden.log
      - name: upload failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-baseline-failures
          path: |
            app/test/**/failures/**
            /tmp/golden.log
          retention-days: 3
          if-no-files-found: ignore
